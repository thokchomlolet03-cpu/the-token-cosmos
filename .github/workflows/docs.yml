name: Publish Master Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'backend/main.py'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'backend/main.py'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit Node.js Frontend Dependencies
        working-directory: frontend
        run: |
          npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install bandit pip-audit

      - name: Run Bandit SAST Security Scan
        working-directory: backend
        run: |
          bandit -r .

      - name: Run Python Dependency SCA (pip-audit)
        working-directory: backend
        run: |
          pip-audit -r requirements.txt

      - name: Run GitLeaks Secrets Detection Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Container Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013,DL3018,DL3007

      - name: Run Backend Unit Tests
        working-directory: backend
        env:
          SKIP_MODEL_LOAD: "true"
        run: |
          python -m unittest discover -s . -p 'test_*.py'

      - name: Generate Fresh API Documentation
        env:
          SKIP_MODEL_LOAD: "true"
        run: |
          python scripts/generate_api_docs.py

      - name: Verify Documentation Links & Files
        run: |
          python scripts/verify_docs.py

  deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate Fresh API Documentation
        env:
          SKIP_MODEL_LOAD: "true"
        run: |
          python scripts/generate_api_docs.py

      - name: Install MkDocs & Theme
        run: |
          python -m pip install mkdocs mkdocs-material

      - name: Build Static Documentation Site
        run: |
          mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_compile: true
