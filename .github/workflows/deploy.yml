name: Deploy "The Token Cosmos" to Google Cloud Run

on:
  push:
    branches:
      - main
      - master

env:
  GCP_REGION: us-central1
  SERVICE_NAME: the-token-cosmos

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker Container Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cosmos-repo/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -f backend/Dockerfile backend/

      - name: Push Container Image to GCP Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cosmos-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy Service to Google Cloud Run with --cpu-boost
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cosmos-repo/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --concurrency 80 \
            --cpu-boost
