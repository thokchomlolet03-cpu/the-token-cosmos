server {
    # Listen at the Cloud Run default port
    listen 8080;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Aggressively cache the massive UMAP coordinate file
    location ~* \.bin$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache JS/CSS build artifacts
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
