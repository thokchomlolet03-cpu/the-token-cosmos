site_name: The Token Cosmos
site_description: Interactive LLM Probability Visualizer & Educational Guide Master Documentation Suite
site_author: Google Deepmind Advanced Agentic Coding Team & The Token Cosmos Contributors

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.tabs
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - admonition

nav:
  - Welcome: index.md
  - System Architecture: architecture.md
  - Infrastructure & Deployment: deployment.md
  - Component Ownership (RACI): ownership.md
  - Monitoring & Observability: monitoring.md
  - Security & Vulnerability: security.md
  - Disaster Recovery: disaster_recovery.md
  - Incident Response Plan: incident_response.md
  - API Reference: api.md
  - SLAs & Requirements: sla.md
  - Developer Onboarding: onboarding.md
  - End-User Manual: user_guide.md
  - Terminology Glossary: glossary.md
  - Compliance & Safety: compliance.md
  - Release Changelog: changelog.md
  - Testing Strategy: testing.md
  - Data Telemetry: telemetry_schema.md
  - Decision Log (ADR-0001): adrs/0001-use-edge-webgpu-inference.md
